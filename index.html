<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          Object.defineProperty(Object.prototype, 'experimentalForceLongPolling', {
            configurable: true,
            enumerable: false,
            get() {
              if (this && typeof this === 'object' && this.experimentalAutoDetectLongPolling !== undefined) {
                return undefined;
              }
              return true;
            },
            set(val) {
              Object.defineProperty(this, 'experimentalForceLongPolling', {
                value: val,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          });
        } catch (e) {
          console.warn('Failed to configure Firestore polling defaults:', e);
        }
      })();
    </script>
